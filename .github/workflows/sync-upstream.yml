name: Sync Upstream (cloudflare/cloudflared)

on:
  schedule:
    # 每 6 小時自動檢查並同步一次上游
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/cloudflare/cloudflared.git
          git fetch upstream master --tags

          BEFORE=$(git rev-parse HEAD)
          git merge upstream/master --no-edit
          AFTER=$(git rev-parse HEAD)

          LATEST_TAG=$(git describe --tags --abbrev=0 upstream/master 2>/dev/null || echo "")
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          if [ "$BEFORE" != "$AFTER" ]; then
            git push origin HEAD:actions
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Win7 MSI Release on new upstream tag
        if: steps.sync.outputs.latest_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.sync.outputs.latest_tag }}"
          if ! gh release view "win7-$TAG" >/dev/null 2>&1; then
            echo "New upstream tag $TAG detected, triggering MSI release..."
            gh workflow run build-win7-msi.yml --ref actions -f version="$TAG" -f create_release=true
          else
            echo "Release win7-$TAG already exists, skipping."
          fi
