name: Build Windows 7 MSI (XTLS/go-win7)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'MSI Version (e.g. 2026.11.0). Leave empty to auto-generate.'
        required: false
        default: ''
      create_release:
        description: 'Create GitHub Release'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - actions
    paths-ignore:
      - '.github/**'

permissions:
  contents: write

jobs:
  build-win7-msi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XTLS/go-win7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download -R XTLS/go-win7 -p "go-for-win7-linux-amd64.zip" -O /tmp/go-win7.zip
          rm -rf /tmp/go-win7-extract
          unzip -q /tmp/go-win7.zip -d /tmp/go-win7-extract
          sudo rm -rf /usr/local/go-win7
          if [ -d /tmp/go-win7-extract/go ]; then
            sudo mv /tmp/go-win7-extract/go /usr/local/go-win7
          else
            sudo mv /tmp/go-win7-extract /usr/local/go-win7
          fi
          chmod +x /usr/local/go-win7/bin/*
          echo "/usr/local/go-win7/bin" >> "$GITHUB_PATH"

      - name: Verify Go & align go.mod if needed
        run: |
          go version
          GO_VER=$(go version | grep -oE 'go[0-9]+\.[0-9]+\.[0-9]+' | sed 's/^go//')
          echo "Using go-win7 version: $GO_VER"
          sed -i -E "s/^go [0-9]+\.[0-9]+(\.[0-9]+)?/go $GO_VER/" go.mod

      - name: Determine Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(git tag -l --sort=-v:refname | grep -E '^[0-9]{4}\.[0-9]+\.[0-9]+$' | head -n 1 || true)
            if [ -z "$VERSION" ]; then
              VERSION="$(date -u +'%Y.%-m').${{ github.run_number }}"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%d-%H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Build cloudflared.exe for Windows 7
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          go build -mod=readonly -ldflags="-s -w -X 'main.Version=${{ steps.version.outputs.version }}' -X 'main.BuildTime=${{ steps.version.outputs.build_time }}'" -o cloudflared.exe ./cmd/cloudflared

      - name: Install msitools (wixl)
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools wixl

      - name: Package MSI
        run: |
          wixl --define Version="${{ steps.version.outputs.version }}" --define Path=cloudflared.exe --output cloudflared-windows-amd64.msi cloudflared.wxs

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudflared-win7-${{ steps.version.outputs.version }}
          path: |
            cloudflared.exe
            cloudflared-windows-amd64.msi

      - name: Create GitHub Release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win7-${{ steps.version.outputs.version }}
          name: cloudflared Win7 ${{ steps.version.outputs.version }}
          files: |
            cloudflared.exe
            cloudflared-windows-amd64.msi
